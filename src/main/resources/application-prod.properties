# Configura\u00e7\u00e3o de Base de Dados CORRETA para Produ\u00e7\u00e3o
spring.datasource.url=jdbc:mysql://172.16.0.30:3306/ldb_estoque?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=ldb
spring.datasource.password=gmSenai
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# Garante que o Hibernate n\u00e3o limpe seu banco e atualize as tabelas
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# Ativa o log para vermos o select no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
